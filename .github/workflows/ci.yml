name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'
      - name: Show go version
        run: |
          go version
          go env
      - name: Clean go cache
        run: |
          go clean -cache -modcache -testcache || true
      - name: Run tests
        run: go test ./... -cover -race
